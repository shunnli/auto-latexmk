[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-latexmk"
version = "0.1.1"
description = "Compile LaTeX projects with automatic engine selection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pathspec>=1.1.1",
    "tqdm>=4.66",
]

[project.scripts]
auto-latexmk = "auto_latexmk.cli:main"
auto-latexmk-clean = "auto_latexmk.cli:clean_main"
auto-latexmk-rebuild = "auto_latexmk.cli:rebuild_main"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_latexmk"]
